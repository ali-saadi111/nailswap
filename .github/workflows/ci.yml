name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_ROOT_DOMAIN: nailswap.app
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.LOCAL_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LOCAL_SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU' }}
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  INTERNAL_API_SECRET: ci-internal-secret-0123456789
  CRON_SECRET: ci-cron-secret

jobs:
  static:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  database:
    name: Migrations, RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Work around broken storage-api:v1.77.0 image (empty package.json; see README)
        run: |
          docker pull public.ecr.aws/supabase/storage-api:v1.72.1
          docker tag public.ecr.aws/supabase/storage-api:v1.72.1 public.ecr.aws/supabase/storage-api:v1.77.0
      - name: Start Supabase (applies all migrations)
        run: pnpm exec supabase start -x vector,logflare,studio,imgproxy,edge-runtime
      - name: Migration check (schema must match committed migrations)
        run: |
          pnpm exec supabase db lint --local --level error
          diff=$(pnpm exec supabase db diff --local --schema public || true)
          if [ -n "$diff" ]; then echo "Uncommitted schema drift:"; echo "$diff"; exit 1; fi
      - name: Types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts
      - run: pnpm test:rls

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Work around broken storage-api:v1.77.0 image (see README)
        run: |
          docker pull public.ecr.aws/supabase/storage-api:v1.72.1
          docker tag public.ecr.aws/supabase/storage-api:v1.72.1 public.ecr.aws/supabase/storage-api:v1.77.0
      - run: pnpm exec supabase start -x vector,logflare,studio,imgproxy,edge-runtime
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
